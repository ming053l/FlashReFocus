# Stage I training mixture (Sec. 3.1, Appendix B): each source with its sampling probability p.
# ${FLASHREFOCUS_REPO} and ${FLASHREFOCUS_DATA} are expanded with the defaults of paths.py.
dpdd:        # (A) DPDD training split
  root: ${FLASHREFOCUS_DATA}/dd_dp_dataset_png
  p: 0.3
realbokeh:   # (B) RealBokeh pairs reversed into deblurring pairs: 4,179 pairs of the 1,000 sharpest scenes
  manifest: ${FLASHREFOCUS_REPO}/training/configs/realbokeh_deblurring_top1000.csv
  p: 0.2
lfdof:       # (C) LFDOF training split
  root: ${FLASHREFOCUS_DATA}/LFDOF
  p: 0.3
synthetic:   # (D) DIV2K with synthetic spatially varying blur at radii 1, 5.5 and 10 pixels
  root: ${FLASHREFOCUS_DATA}/div2k/DIV2K_train_HR
  p: 0.2
  radius_min: 1.0
  radius_max: 10.0
